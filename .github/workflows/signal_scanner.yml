name: 24/7 Signal Scanner & Streamlit Keep-Alive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  scan_and_wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Streamlit Cloud App (Keep 24/7 Stateful Daemon Alive)
        run: |
          curl -s -L -o /dev/null -w "Streamlit HTTP Status: %{http_code}\n" "https://shiv-prakash-trade-assistant.streamlit.app" || true
